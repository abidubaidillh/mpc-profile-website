name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual triggering

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run npm audit
      id: audit
      run: |
        npm audit --audit-level=moderate || true
        # Save audit results to file
        npm audit --json > audit-report.json || echo "{}" > audit-report.json
    
    - name: Upload audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: npm-audit-report
        path: audit-report.json
    
    - name: Check for critical vulnerabilities
      run: |
        if [ -f audit-report.json ]; then
          VULN_COUNT=$(jq '.metadata.vulnerabilities.critical + .metadata.vulnerabilities.high' audit-report.json)
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "Found $VULN_COUNT critical/high vulnerabilities"
            echo "VULN_COUNT=$VULN_COUNT" >> $GITHUB_ENV
          else
            echo "No critical/high vulnerabilities found"
            echo "VULN_COUNT=0" >> $GITHUB_ENV
          fi
        else
          echo "audit-report.json not found"
          echo "VULN_COUNT=0" >> $GITHUB_ENV
        fi
    
    - name: Comment on PR if vulnerabilities found
      if: github.event_name == 'pull_request' && env.VULN_COUNT > 0
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          } catch (e) {}
          
          const critical = report.metadata?.vulnerabilities?.critical || 0;
          const high = report.metadata?.vulnerabilities?.high || 0;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `⚠️ **Security Alert** ⚠️\n\nFound ${critical} critical and ${high} high vulnerabilities in dependencies.\n\nPlease run \`npm audit\` locally and update dependencies before merging.`
          });
    
    - name: Fail workflow on critical vulnerabilities
      if: env.VULN_COUNT > 0
      run: |
        echo "Critical/High vulnerabilities detected. Failing workflow."
        exit 1

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        comment-summary-in-pr: true
